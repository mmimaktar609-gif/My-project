<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deo Bot Panel V2</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="login" class="login">
  <div class="loginbox"><div class="logo">🤖</div><h1>Deo Bot Panel</h1>
  <input id="user" placeholder="Username" value="admin">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">🔐 Login</button><p id="loginmsg"></p></div>
</div>
<div id="app" class="hidden">
<header><div class="brand"><span class="logo">🤖</span><b>Bot Panel</b></div>
<div class="top"><span id="status">🔴 বন্ধ</span><span>🟢 DB ✅</span><button onclick="logout()">বের</button></div></header>
<main>
<div class="grid">
<div class="card"><span>💾</span><b id="memory">0 MB</b><small>Memory</small></div>
<div class="card"><span>⏱️</span><b id="uptime">0s</b><small>Server Uptime</small></div>
<div class="card"><span>📦</span><b id="files">0</b><small>Bot Files</small></div>
<div class="card"><span>🚀</span><b id="starts">0</b><small>Bot Start</small></div>
<div class="card"><span>💥</span><b id="crashes">0</b><small>Crash</small></div>
<div class="card"><span>⏱️</span><b id="botup">0s</b><small>Bot Uptime</small></div>
<div class="card"><span>🖥️</span><b id="node">-</b><small>Node.js</small></div>
</div>
<section class="controls">
<button onclick="action('start')">▶️ Start</button><button onclick="action('stop')">⏹️ Stop</button><button onclick="action('restart')">🔄 Restart</button>
</section>
<section class="panel"><h2>📜 Live Console Logs</h2><pre id="logs"></pre></section>
<section class="panel"><h2>📁 File Manager</h2><div id="filesbox"></div></section>
</main>
<nav><button onclick="scrollTo(0,0)">🏠<small>হোম</small></button><button onclick="document.querySelector('.panel').scrollIntoView()">📊<small>স্ট্যাটাস</small></button><button onclick="document.getElementById('logs').scrollIntoView()">📋<small>লগ</small></button><button onclick="document.getElementById('filesbox').scrollIntoView()">📁<small>ফাইল</small></button><button onclick="location.reload()">⚙️<small>রিফ্রেশ</small></button></nav>
</div>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script>
</body></html>
