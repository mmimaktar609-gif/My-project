<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <title>HRIDOY BOT PANEL V2</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070a12;
      --card: rgba(20, 25, 42, .78);
      --border: rgba(255,255,255,.09);
      --text: #f4f7ff;
      --muted: #8992aa;
      --primary: #7c5cff;
      --primary2: #a66cff;
      --green: #35e49a;
      --red: #ff5577;
      --blue: #42a5ff;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(124,92,255,.22), transparent 30%),
        radial-gradient(circle at 90% 10%, rgba(66,165,255,.12), transparent 28%),
        linear-gradient(145deg,#05070d,#0b0f1d 55%,#080a13);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 22px 5%;
      background: rgba(7,10,18,.78);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .logo {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: linear-gradient(135deg,var(--primary),var(--primary2));
      box-shadow: 0 10px 35px rgba(124,92,255,.35);
      font-size: 24px;
    }

    h1 {
      font-size: clamp(19px,4vw,27px);
      letter-spacing: .5px;
    }

    header p {
      color: var(--muted);
      margin-top: 4px;
      font-size: 13px;
    }

    .primary {
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      background: linear-gradient(135deg,var(--primary),var(--primary2));
      box-shadow: 0 8px 25px rgba(124,92,255,.28);
      font-weight: 700;
    }

    .primary:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    main {
      width: min(1180px,92%);
      margin: 30px auto 70px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 16px;
      margin-bottom: 22px;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 23px;
      border: 1px solid var(--border);
      border-radius: 19px;
      background: var(--card);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0,0,0,.2);
    }

    .card::after {
      content: "";
      position: absolute;
      width: 90px;
      height: 90px;
      right: -35px;
      top: -35px;
      border-radius: 50%;
      background: rgba(124,92,255,.13);
    }

    .card b {
      display: block;
      font-size: 34px;
      margin-bottom: 7px;
    }

    .card span {
      color: var(--muted);
      font-size: 14px;
    }

    .panel {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px rgba(0,0,0,.22);
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .panel-title h2 {
      font-size: 18px;
    }

    .panel-title button {
      color: #cbd2e5;
      padding: 9px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,.05);
    }

    .bots {
      display: grid;
      gap: 13px;
    }

    .bot {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 15px;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,.025);
      transition: .2s;
    }

    .bot:hover {
      border-color: rgba(124,92,255,.4);
      transform: translateY(-2px);
    }

    .bot-info {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .bot-icon {
      width: 45px;
      height: 45px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: rgba(124,92,255,.15);
      font-size: 22px;
    }

    .bot-info h3 {
      font-size: 16px;
      margin-bottom: 5px;
    }

    .bot-info small {
      display: block;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 400px;
    }

    .status {
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .status.running {
      color: var(--green);
      background: rgba(53,228,154,.09);
      border: 1px solid rgba(53,228,154,.2);
    }

    .status:not(.running) {
      color: var(--red);
      background: rgba(255,85,119,.08);
      border: 1px solid rgba(255,85,119,.2);
    }

    .actions {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .actions button {
      color: #dfe5f5;
      padding: 9px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,.055);
      border: 1px solid var(--border);
      font-size: 12px;
    }

    .actions button:hover {
      background: rgba(124,92,255,.16);
      border-color: rgba(124,92,255,.35);
    }

    .actions .danger:hover {
      background: rgba(255,85,119,.12);
      border-color: rgba(255,85,119,.3);
    }

    .empty {
      padding: 45px 15px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 15px;
    }

    #console {
      margin-top: 20px;
    }

    pre {
      min-height: 230px;
      max-height: 480px;
      overflow: auto;
      padding: 17px;
      border-radius: 14px;
      background: #03050a;
      color: #a9f5ce;
      border: 1px solid var(--border);
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(8px);
    }

    .modal-box {
      width: min(430px,100%);
      padding: 24px;
      border-radius: 20px;
      background: #101523;
      border: 1px solid var(--border);
      box-shadow: 0 30px 100px rgba(0,0,0,.55);
    }

    .modal-box h2 {
      margin-bottom: 18px;
    }

    .modal-box input {
      width: 100%;
      margin-bottom: 12px;
      padding: 13px 14px;
      outline: none;
      color: white;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #080c16;
    }

    .modal-box input:focus {
      border-color: var(--primary);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 7px;
    }

    .modal-actions button {
      padding: 11px 15px;
      color: #dce2f2;
      border-radius: 10px;
      background: rgba(255,255,255,.06);
    }

    .hidden {
      display: none !important;
    }

    footer {
      text-align: center;
      color: #596279;
      font-size: 12px;
      margin-top: 30px;
    }

    @media(max-width:700px) {
      header {
        padding: 15px 4%;
      }

      header .primary {
        padding: 10px 12px;
        font-size: 12px;
      }

      .logo {
        width: 42px;
        height: 42px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 18px;
      }

      .bot {
        grid-template-columns: 1fr;
      }

      .status {
        justify-self: start;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(2,1fr);
      }

      .actions button {
        width: 100%;
      }

      main {
        width: 94%;
        margin-top: 20px;
      }

      .panel {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">💠</div>
    <div>
      <h1>HRIDOY BOT PANEL</h1>
      <p>Bot Manager V2 • Mobile Friendly</p>
    </div>
  </div>

  <button class="primary" onclick="openCreate()">＋ Create Bot</button>
</header>

<main>

  <section class="stats">
    <div class="card">
      <b id="total">0</b>
      <span>🤖 Total Bots</span>
    </div>

    <div class="card">
      <b id="online">0</b>
      <span>🟢 Running</span>
    </div>

    <div class="card">
      <b id="offline">0</b>
      <span>🔴 Stopped</span>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">
      <h2>🤖 Bot Manager</h2>
      <button onclick="loadBots()">↻ Refresh</button>
    </div>

    <div id="bots" class="bots"></div>
  </section>

  <section id="console" class="panel hidden">
    <div class="panel-title">
      <h2>📜 Console: <span id="consoleName"></span></h2>
      <button onclick="closeConsole()">Close</button>
    </div>

    <pre id="logs">Loading...</pre>
  </section>

  <footer>
    💠 HRIDOY BOT PANEL V2 • Developer: HRIDOY HASAN SHANTO
  </footer>

</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h2>➕ Create Bot</h2>

    <input
      id="botName"
      placeholder="Bot name e.g. deo"
      autocomplete="off"
    >

    <input
      id="botCommand"
      value="node index.js"
      placeholder="Start command"
      autocomplete="off"
    >

    <div class="modal-actions">
      <button onclick="closeCreate()">Cancel</button>
      <button class="primary" onclick="createBot()">Create</button>
    </div>
  </div>
</div>

<script>
let currentBot = null;

const $ = id => document.getElementById(id);

async function api(url, options = {}) {
  const r = await fetch(url, {
    headers: {
      "Content-Type": "application/json"
    },
    ...options
  });

  const data = await r.json().catch(() => ({}));

  if (!r.ok) {
    throw new Error(data.error || "Request failed");
  }

  return data;
}

async function loadBots() {
  try {
    const bots = await api("/api/bots");

    $("total").textContent = bots.length;

    $("online").textContent =
      bots.filter(b => b.status === "running").length;

    $("offline").textContent =
      bots.filter(b => b.status !== "running").length;

    const box = $("bots");

    if (!bots.length) {
      box.innerHTML = `
        <div class="empty">
          🤖 কোনো Bot নেই।<br><br>
          উপরের “Create Bot” চাপুন।
        </div>
      `;
      return;
    }

    box.innerHTML = bots.map(b => `
      <article class="bot">

        <div class="bot-info">
          <div class="bot-icon">🤖</div>

          <div>
            <h3>${escapeHtml(b.name)}</h3>
            <small>${escapeHtml(b.command)}</small>
          </div>
        </div>

        <span class="status ${b.status}">
          ${b.status === "running"
            ? "● RUNNING"
            : "● STOPPED"}
        </span>

        <div class="actions">

          <button onclick="act('${safeName(b.name)}','start')">
            ▶ Start
          </button>

          <button onclick="act('${safeName(b.name)}','stop')">
            ⏹ Stop
          </button>

          <button onclick="act('${safeName(b.name)}','restart')">
            🔄 Restart
          </button>

          <button onclick="showLogs('${safeName(b.name)}')">
            📜 Logs
          </button>

          <button class="danger"
            onclick="removeBot('${safeName(b.name)}')">
            🗑 Delete
          </button>

        </div>

      </article>
    `).join("");

  } catch (e) {
    console.error(e);
  }
}

function safeName(name) {
  return String(name)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
}

async function act(name, action) {
  try {
    await api(
      `/api/bots/${encodeURIComponent(name)}/${action}`,
      { method: "POST" }
    );

    await loadBots();

  } catch (e) {
    alert(e.message);
  }
}

async function removeBot(name) {
  if (!confirm(`Delete ${name}?`)) return;

  try {
    await api(
      `/api/bots/${encodeURIComponent(name)}`,
      { method: "DELETE" }
    );

    closeConsole();
    await loadBots();

  } catch (e) {
    alert(e.message);
  }
}

async function showLogs(name) {
  try {
    currentBot = name;

    $("console").classList.remove("hidden");
    $("consoleName").textContent = name;
    $("logs").textContent = "Loading...";

    const data = await api(
      `/api/bots/${encodeURIComponent(name)}/logs`
    );

    $("logs").textContent =
      data.logs || "No logs yet.";

    $("console").scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  } catch (e) {
    $("logs").textContent = "Error: " + e.message;
  }
}

function closeConsole() {
  $("console").classList.add("hidden");
  currentBot = null;
}

function openCreate() {
  $("modal").classList.remove("hidden");
  $("botName").focus();
}

function closeCreate() {
  $("modal").classList.add("hidden");
}

async function createBot() {
  try {
    const name = $("botName").value.trim();
    const command = $("botCommand").value.trim();

    if (!name) {
      alert("Bot name দিন!");
      return;
    }

    if (!command) {
      alert("Start command দিন!");
      return;
    }

    await api("/api/bots", {
      method: "POST",
      body: JSON.stringify({
        name,
        command
      })
    });

    closeCreate();

    $("botName").value = "";

    await loadBots();

  } catch (e) {
    alert(e.message);
  }
}

function escapeHtml(s) {
  return String(s).replace(
    /[&<>"']/g,
    c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[c])
  );
}

$("modal").addEventListener("click", e => {
  if (e.target === $("modal")) {
    closeCreate();
  }
});

loadBots();

setInterval(loadBots, 5000);
</script>

</body>
</html>
